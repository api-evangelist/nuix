signals:
  data_subject_request:
    url: https://www.nuix.com/privacy-policy
    section: '10. ACCESS TO AND CORRECTION OF MY PERSONAL INFORMATION; 20. How to Submit a Request'
    channel: privacy@nuix.com
    stated_sla: 'We will respond to verifiable consumer requests within 45 days of receipt.'
    rights_named: [access, correction, restriction of processing, erasure, data portability, right to know (CA), right to delete (CA), right to correct (CA), opt out of sale/sharing (CA), limit use of sensitive PI (CA), non-discrimination (CA)]
    evidence:
    - source: https://www.nuix.com/privacy-policy
      http_status: 200
      fetched: '2026-10-21'
      quote: >-
        You may request access to and correction of your personal data, limitations on processing or
        disclosures or your personal data, and erasure of your personal information that we hold about you
        by contacting us using the contact details set out in Section 1 of this notice.
    - source: https://www.nuix.com/privacy-policy
      http_status: 200
      fetched: '2026-10-21'
      quote: >-
        To exercise your rights, please contact us at privacy@nuix.com or write to us at Nuix North America
        Inc., Suite 320, 12100 Sunset Hills Rd., Reston, VA 20171. We will verify your identity before
        fulfilling your request. You may designate an authorized agent to make a request on your behalf. We
        will respond to verifiable consumer requests within 45 days of receipt.
    note: >-
      Requests go by email or post (no self-service form or API is documented). The 45-day response
      commitment is stated in the California section (20); the general section 10 gives no timeframe.
  global_privacy_control:
    honored: true
    scope: California residents
    url: https://www.nuix.com/privacy-policy
    section: '5. COOKIES AND OTHER TRACKING MECHANISMS'
    evidence:
    - source: https://www.nuix.com/privacy-policy
      http_status: 200
      fetched: '2026-10-21'
      quote: >-
        For California residents: we do recognize and honor Global Privacy Control (GPC) opt-out preference
        signals as a valid request to opt out of the sale or sharing of your personal information, as
        required by the California Privacy Rights Act (CPRA).
    note: >-
      A published statement that GPC is honoured, limited by its own words to California residents. The
      same section says "our systems do not recognize browser “do-not-track” requests".
  ai_transparency:
    url: https://www.nuix.com/privacy-policy
    section: '3. USE OF PERSONAL DATA'
    evidence:
    - source: https://www.nuix.com/privacy-policy
      http_status: 200
      fetched: '2026-10-21'
      quote: >-
        Nuix may use artificial intelligence, machine learning, or other automated processing technologies
        in the course of its business operations, including to improve our products and services, support
        internal decision-making, or enhance security. Where AI or automated technologies are used to process
        your personal data, we will ensure that appropriate safeguards are in place, including human
        oversight where decisions have a significant affect on you. We do not use AI to make solely automated
        decisions that produce legal or similarly significant affects on individuals without appropriate
        safeguards and, where required, your consent.
    note: >-
      A privacy-notice disclosure about AI use on personal data and automated decision-making. It is not a
      product-level AI disclosure page and says nothing about model provenance or training data.
  subprocessors:
    url: 'https://www.nuix.com/sites/default/files/2026-06/Nuix%20Data%20Processing%20Addendum%20%28Nuix%20as%20Processor%20for%20Customers%29%20v%204%20June%202026.pdf'

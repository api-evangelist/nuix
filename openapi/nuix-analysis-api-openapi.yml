  /cases/{caseId}/history:
    get:
      tags:
      - Analysis
      summary: Returns history events for a case
      description: 'Use this operation to get a list of history events associated

        with a case. The events are returned in ascending order by date. Each history

        event represents an individual action performed by a user. This following

        are the types of history events:


        * **openSession:** This event occurs at the start of a session with a case (for example, when the

        case is opened).

        * **closeSession:** This event occurs at the end of a session with a case (for example, when the case is closed).

        * **loadData:** This event occurs when data is loaded into the case.

        * **search:** This event occurs when a search is performed.

        * **annotation:** This event occurs when items are annotated or tagged.

        * **export:** This event occurs when data or metadata is exported out of the case.

        * **import**: This event occurs when data or metadata is imported into the case. With import,

        the data is directly imported without processing.

        * **delete:** This event occurs when data in the case is deleted.

        * **script:** This event occurs when a script is executed.

        * **printPreview:** This event occurs when a print preview action is executed.'
      operationId: getCaseHistory
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      - name: type
        in: query
        description: Filters the type of history event returned.  If not specified, all events are returned.
        required: false
        schema:
          type: string
          enum:
          - openSession
          - closeSession
          - loadData
          - search
          - annotation
          - export
          - import
          - delete
          - script
          - printPreview
      - name: user
        in: query
        description: The user to return the events for. If the user does not exist, no records will be returned.
        required: false
        schema:
          type: string
      - name: startDateAfter
        in: query
        description: The start date to filter after (only more recent events will be returned.) Accepted date formats are RFC-3339 or a simple date format (yyyy-MM-dd) which will use the default timezone of the server.
        required: false
        schema:
          type: string
      - name: endDateBefore
        in: query
        description: The start date to filter before (only earlier events will be returned.) Accepted date formats are RFC-3339 or a simple date format (yyyy-MM-dd) which will use the default timezone of the server.
        required: false
        schema:
          type: string
      - name: order
        in: query
        description: The order to return the results in.
        required: false
        schema:
          type: string
          default: start_date_ascending
          enum:
          - start_date_ascending
          - start_date_descending
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v1+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CaseHistoryEventResponse'
              example:
              - cancelled: false
                details:
                  searchString: '*'
                startDate: 1588363137585
                endDate: 1588363137591
                failed: false
                succeeded: true
                unknown: false
                type: search
                username: youruser
              - cancelled: false
                details:
                  version: 8.6.0.33
                startDate: 1588363137585
                endDate: 1588363137591
                failed: false
                succeeded: true
                type: openSession
                username: youruser

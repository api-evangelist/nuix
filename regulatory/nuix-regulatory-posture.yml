  incident_notification:
    url: https://www.nuix.com/privacy-policy
    section: '18. DATA BREACH NOTIFICATION; DPA 5. Personal Data Breach Response'
    stated_sla: 'without undue delay (DPA 5.1); "within the timeframes required by applicable law" (privacy notice)'
    evidence:
    - source: https://www.nuix.com/privacy-policy
      http_status: 200
      fetched: '2026-10-21'
      quote: >-
        Should a breach occur that poses a risk to your rights and freedoms, we will notify affected
        individuals and relevant supervisory authorities within the timeframes required by applicable law,
        including GDPR requirements where applicable.
    - source: 'https://www.nuix.com/sites/default/files/2026-06/Nuix%20Data%20Processing%20Addendum%20%28Nuix%20as%20Processor%20for%20Customers%29%20v%204%20June%202026.pdf'
      http_status: 200
      fetched: '2026-10-21'
      quote: >-
        5.1 Notification. Upon becoming aware of a Personal Data Breach that affects Personal Data, Nuix will
        notify Customer without undue delay and will provide information relating to such Breach as
        reasonably requested by Customer.
    note: >-
      No fixed hour count is stated anywhere read. The privacy notice also commits to the Australian
      Notifiable Data Breaches scheme ("We will notify affected individuals and the Office of the Australian
      Information Commissioner (OAIC) as required by law.").
  exit_assistance:
    url: 'https://www.nuix.com/sites/default/files/2026-06/Nuix%20Solutions%20Terms%20v%201%20July%202026.pdf'
    section: '7. Duration and Termination, (b) End of Subscription Period; DPA 8. Deletion of Personal Data'
    stated_period: '10 days from the end of the Subscription Period'
    evidence:
    - source: 'https://www.nuix.com/sites/default/files/2026-06/Nuix%20Solutions%20Terms%20v%201%20July%202026.pdf'
      http_status: 200
      fetched: '2026-10-21'
      quote: >-
        Customer will have 10 days from the end of the Subscription Period in which to download the Customer
        Data from the relevant Solution (“Data Download Period”), after which time (subject to the parties
        reaching an alternative arrangement, for which additional costs will apply): (1) Customer will no
        longer be able to access the Customer Data in that Solution; and (2) if the Solution is a SaaS
        Offering, Nuix will delete the Customer Data in that Solution (other than residual copies of data
        from backup or disaster recovery systems).
    - source: 'https://www.nuix.com/sites/default/files/2026-06/Nuix%20Data%20Processing%20Addendum%20%28Nuix%20as%20Processor%20for%20Customers%29%20v%204%20June%202026.pdf'
      http_status: 200
      fetched: '2026-10-21'
      quote: >-
        Following expiration or termination of the Agreement, and at any time during the term of the
        Agreement upon written request, Nuix will delete or return to Customer any Personal Data in Nuix’s
        possession, except to the extent Nuix is required by applicable law to retain some or all of the
        Personal Data
    note: >-
      A contractual post-termination data download window (10 days, longer only by paid arrangement) and a
      delete-or-return commitment. The privacy notice separately grants a GDPR-style data portability right
      ("in a structured, commonly used, machine-readable format").
  data_retention:
    url: https://www.nuix.com/privacy-policy
    section: '12. RETENTION OF YOUR PERSONAL DATA'
    evidence:
    - source: https://www.nuix.com/privacy-policy
      http_status: 200
      fetched: '2026-10-21'
      quote: >-
        We apply a general rule of keeping personal data only for as long as required to fulfill the purposes
        for which it was collected. In general, we retain your personal data for a period of time
        corresponding to a statute of limitation, for example, to maintain an accurate record of your
        dealings with us.
    - source: 'https://www.nuix.com/sites/default/files/2026-06/Nuix%20Solutions%20Terms%20v%201%20July%202026.pdf'
      http_status: 200
      fetched: '2026-10-21'
      quote: 'Customer Data in a SaaS Offering will be unrecoverable, including from any back-ups, 90 days after the end of the Solution Subscription Period.'
    note: >-
      The privacy notice gives a purpose-bound rule with no fixed period. The Solutions Terms give a hard
      90-day outer limit for SaaS customer data, backups included, after the subscription ends.
  support_lifetime:
    url: 'https://www.nuix.com/sites/default/files/2026-06/Nuix%20Software%20Support%20Terms%20v%204%20June%202026.pdf'
    section: '7. Supported Versions'
    stated_period: 'not less than 12 months from the date on which the major update is first made generally available to customers'
    evidence:
    - source: 'https://www.nuix.com/sites/default/files/2026-06/Nuix%20Software%20Support%20Terms%20v%204%20June%202026.pdf'
      http_status: 200
      fetched: '2026-10-21'
      quote: >-
        Following the release of a major update, the Supplier will continue to support the immediately
        preceding major update version (“Supported Prior Version”) for a period of not less than 12 months
        from the date on which the major update is first made generally available to customers (“Supported
        Period”).
    note: >-
      Applies to on-premises Software. The SaaS Support Terms say instead that customers are kept on one
      current Supported Version, and the Solutions Terms (15.10) allow a Solution to be discontinued at the
      end of a Subscription Period with at least 60 days' written notice.

openapi: 3.2.0
info:
  title: Nuix REST-API Reference Export API
  description: 'Welcome to the Nuix REST API documentation. From here you can access all available REST APIs and execute queries against your running REST instance.


    # Authentication Changes


    The `nuix-auth-token` header is being deprecated in favor of standard JWT. The header will be removed in a

    future release. Until the removal of the header, the Nuix REST API will accept the JWT in either the

    `nuix-auth-token` header field or the `Authorization` header field prefixed by `Bearer`.'
  contact:
    name: Nuix
    url: http://forums.nuix.com/
  license:
    name: Licence
    url: https://www.nuix.com/sites/default/files/2023-03/End%20User%20License%20Agreement%20%28Effective%20December%2014%2C%202022%29_1.pdf
  version: ${customer.version}
servers:
- url: /nuix-restful-service/svc
- url: http://localhost:8080/svc
security:
- ApiKeyAuth: []
- bearerAuth: []
tags:
- name: Export
paths:
  /cases/{caseId}/thumbnails:
    post:
      tags:
      - Export
      summary: Generates thumbnails for a case
      description: Use this operation to generate thumbnails for a case.
      operationId: generateThumbnails
      parameters:
      - name: caseId
        in: path
        description: case identifier token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/ThumbnailUtilityRequest'
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/AsyncFunctionResponse'
    delete:
      tags:
      - Export
      summary: Deletes the case's thumbnails folder, containing all generated media
      description: Use this operation to delete the case's thumbnails folder containing all generated media.
      operationId: deleteCaseThumbnailFolder
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/Success'
  /cases/{caseId}/promoteToDiscover/{discoverCaseId}:
    post:
      tags:
      - Export
      summary: Promotes a list of items to Nuix Discover®
      description: Use this operation to promote a list of items to Nuix Discover®
      operationId: submitPromoteToDiscoverJob
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      - name: discoverCaseId
        in: path
        description: Nuix Discover Case ID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/PromoteToDiscoverRequest'
            example:
              query: '*'
              deduplicated: false
              discoverDeduplication: false
              apiAccessToken: YOUR_NUIX_DISCOVER_API_ACCESS_TOKEN
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/AsyncFunctionResponse'
              examples:
                Standard Asynchronous Function Response:
                  value:
                    functionKey: e0319b96-5c84-40f4-adce-2f3d6aa0465a
                    location: http://localhost:8080/svc/v1/asyncFunctions/e0319b96-5c84-40f4-adce-2f3d6aa0465a
                Promote To Discover Response:
                  value:
                    done: true
                    cancelled: false
                    result:
                      totalItems: 1
                      processedItems: 1
                      processedBytes: 25893
                      failedItems: 0
                    token: 3d7c813a-9be0-4284-9e28-5c111a781ee6
                    functionKey: e0319b96-5c84-40f4-adce-2f3d6aa0465a
                    progress: 1
                    total: 1
                    percentComplete: 100.0
                    updatedOn: 1606337690126
                    requestTime: 1606337664447
                    startTime: 1606337671715
                    finishTime: 1606337692602
                    caseId: 34625454770746279e0e21459d99d992
                    caseName: MyDiscoverCase
                    action: PromoteToDiscoverFunction
                    options:
                      deduplicated: false
                      discoverCaseId: 1036
                      discoverDeduplication: false
                      query: '*'
                      caseId: 34625454770746279e0e21459d99d992
                    participatingInCaseFunctionQueue: true
                    processedBy: rest-server-2
  /cases/{caseId}/export:
    put:
      tags:
      - Export
      summary: Exports production sets and items from a case
      description: 'Use this operation to export production sets and items from a

        case. You can perform two types of exports: legal or item. Legal exports create

        a load file during export.'
      operationId: export
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/AsyncFunctionResponse'
  /cases/{caseId}/slipsheets:
    put:
      tags:
      - Export
      summary: Generates Slipsheets for items in a case
      description: Use this operation to generate slipsheets for items in a case.
      operationId: generateSlipsheets
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/SlipsheetsRequest'
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/AsyncFunctionResponse'
  /cases/{caseId}/stores:
    put:
      tags:
      - Export
      summary: Populate stores
      description: Use this operation to populate stores for items in a case.
      operationId: populateStores
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/PopulateStoresRequest'
            examples:
              Populate binary store and printed image store:
                value:
                  itemGuids:
                  - 706e8a5e-3457-437a-b0c7-49d3dfa8736f
                  - 806e8a5e-3457-437a-b0c7-49d3dfa8736g
                  - 906e8a5e-3457-437a-b0c7-49d3dfa8736h
                  imagingProfileName: Default
                  overwriteExisting: true
                  populateBinaryStores: true
                  populatePrintedImageStores: true
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/AsyncFunctionResponse'
              example:
                Response with Zero failures:
                  itemGuids:
                  - 706e8a5e-3457-437a-b0c7-49d3dfa8736f
                  - 9581abc8-4f92-4b1f-bc65-7ff6445c449b
                  failedItemGuids: []
                Response with some failures:
                  itemGuids:
                  - 706e8a5e-3457-437a-b0c7-49d3dfa8736f
                  - 9581abc8-4f92-4b1f-bc65-7ff6445c449b
                  failedItemGuids:
                  - 706e8a5e-3457-437a-b0c7-49d3dfa8736f
        '400':
          description: Invalid Property
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/ClusteredRestErrorResponse'
              example:
                serverId: nuix-restful-server-1
                errorCode: INVALID_REQUEST_FORMAT
                developerMessage: Both 'populatePrintedImageStores' and `populateBinaryStores` can not be false.
                userMessage: null
                additionalInfo: null
  /cases/{caseId}/items/{itemGuid}/download:
    get:
      tags:
      - Export
      summary: Downloads an item from a case
      description: Use this operation to download a specific item from a case. This API uses the original file name to determine the best format to download the item. The item is downloaded by streaming its binary content using its original file name and MIME type. This content is returned in the response body.
      operationId: downloadItem
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      - name: itemGuid
        in: path
        description: Item GUID
        required: true
        schema:
          type: string
      - name: overwriteExisting
        in: query
        description: Overwrite Existing; this value is treated as always true for PDFs
        required: false
        schema:
          type: boolean
          default: false
      - name: populateBinaryStores
        in: query
        description: If true, the binary store will be regenerated for this item.
        required: false
        schema:
          type: boolean
          default: false
      - name: populatePrintedImageStores
        in: query
        description: If true, the printed image store will be regenerated for this item.
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: default response
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
    head:
      tags:
      - Export
      summary: Downloads an item from a case
      description: Use this operation to download a specific item from a case. This API uses the original file name to determine the best format to download the item. The item is downloaded by streaming its binary content using its original file name and MIME type. This content is returned in the response body.
      operationId: downloadItemHead
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      - name: itemGuid
        in: path
        description: Item GUID
        required: true
        schema:
          type: string
      - name: overwriteExisting
        in: query
        description: Overwrite Existing; this value is treated as always true for PDFs
        required: false
        schema:
          type: boolean
          default: false
      - name: populateBinaryStores
        in: query
        description: If true, the binary store will be regenerated for this item.
        required: false
        schema:
          type: boolean
          default: false
      - name: populatePrintedImageStores
        in: query
        description: If true, the printed image store will be regenerated for this item.
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v1+json:
              schema:
                type: string
  /cases/{caseId}/itemBinaries/{itemGuid}:
    get:
      tags:
      - Export
      summary: Streams an item binary from a case if it is available
      description: Use this operation to stream a specific item binary from a case if the item binary is available.This API uses the original file name to determine the best format to download the item.The item is downloaded by streaming its binary content using its original file name and MIME type.
      operationId: downloadItemBinary
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      - name: itemGuid
        in: path
        description: Item GUID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: default response
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '500':
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusteredRestErrorResponse'
              examples:
                Source Item Not Available:
                  value:
                    serverId: nuix-restful-server-1
                    errorCode: ENGINE_EXCEPTION
                    developerMessage: Error getting byte region
                    userMessage: Could not export item as binary
                    additionalInfo:
                      rootExceptionClass: java.io.IOException
                      rootExceptionMessage: 'Source data missing for item: 3d4ad678-4127-423a-aea1-956de9ed2d21/item.pdf/ (image/jpeg) {cd6f8bd9-3b7e-450e-afd3-2f1be82a3bdf}'
    head:
      tags:
      - Export
      summary: Streams an item binary from a case if it is available
      description: Use this operation to stream a specific item binary from a case if the item binary is available.This API uses the original file name to determine the best format to download the item.The item is downloaded by streaming its binary content using its original file name and MIME type.
      operationId: downloadItemBinary_1
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      - name: itemGuid
        in: path
        description: Item GUID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: default response
        '500':
          description: error response
  /cases/{caseId}/items/{itemGuid}/view:
    get:
      tags:
      - Export
      summary: Enables you to view a case item
      description: 'Use this operation to view a case item. The REST API uses the original file name to determine the best format to view the item. This endpoint returns the binary data with the MIME type set in the Content-Type header so you are viewing the actual item.


        For example, you can use this endpoint to view a case item in a web browser. The API will determine the best format to view this item in the browser.'
      operationId: downloadItemBestFormat
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      - name: itemGuid
        in: path
        description: Item GUID
        required: true
        schema:
          type: string
      - name: overwriteExisting
        in: query
        description: Overwrite Existing
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: default response
          content:
            multipart/form-data:
              schema:
                type: string
                format: binary
    head:
      tags:
      - Export
      summary: Enables you to view a case item
      description: 'Use this operation to view a case item. The REST API uses the original file name to determine the best format to view the item. This endpoint returns the binary data with the MIME type set in the Content-Type header so you are viewing the actual item.


        For example, you can use this endpoint to view a case item in a web browser. The API will determine the best format to view this item in the browser.'
      operationId: downloadItemBestFormatHeadRequest
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      - name: itemGuid
        in: path
        description: Item GUID
        required: true
        schema:
          type: string
      - name: overwriteExisting
        in: query
        description: Overwrite Existing
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v1+json:
              schema:
                type: string
  /cases/{caseId}/productionSets:
    get:
      tags:
      - Export
      summary: Returns all production sets for a case
      description: Use this operation to view all the production sets for a case. You can use this to see a list of which production sets are available for export.
      operationId: getProductionSetsForCase
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      - name: summary
        in: query
        required: false
        description: If set to true, will only retrieve name and GUID.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v1+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductionSetResponse'
              examples:
                Empty Production Set:
                  value:
                  - name: MyProductionSet
                    description: This is a production set
                    guid: 1ecbbbc9-e093-497b-a92f-e9c58f00fb2f
                    frozen: false
                    nextDocumentNumber: null
                    prefix: null
                    nextDocumentId: null
                    firstDocumentNumber: null
                    itemCount: 0
                Production Set With Items:
                  value:
                  - name: MyProductionSet
                    description: This is a production set
                    guid: 1ecbbbc9-e093-497b-a92f-e9c58f00fb2f
                    frozen: false
                    nextDocumentNumber: nuix000000002
                    prefix: nuix
                    nextDocumentId: 2
                    firstDocumentNumber: nuix000000001
                    itemCount: 1
                Production Set Summary Only:
                  value:
                  - name: MyProductionSet
                    description: null
                    guid: 1ecbbbc9-e093-497b-a92f-e9c58f00fb2f
                    frozen: null
                    nextDocumentNumber: null
                    prefix: null
                    nextDocumentId: null
                    firstDocumentNumber: null
                    itemCount: 0
        '404':
          description: Case does not exist
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/ClusteredRestErrorResponse'
              example:
                serverId: nuix-restful-server-1
                errorCode: RESOURCE_NOT_FOUND
                developerMessage: The resource of type 'CASE' and identifier 'ef61c666296e4fc8a0a79288ab697348' could not be found.
                userMessage: The resource of type 'CASE' and identifier 'ef61c666296e4fc8a0a79288ab697348' could not be found.
                additionalInfo:
                  rootExceptionClass: com.nuix.us.exception.i18n.I18nNotFoundException
                  rootExceptionMessage: null
    post:
      tags:
      - Export
      summary: Creates a production set
      description: Use this operation to create a production set in a case. Production sets allow you to manage a set of grouped items for export.
      operationId: createProductionSet
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/vnd.nuix.v2+json:
            schema:
              $ref: '#/components/schemas/BulkProductionSetWithProfilesRequest'
            example:
              name: MyProductionSet
              description: This is a production set
              query: kind:document
              productionProfileName: Default
              imagingProfileName: Default
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v2+json:
              schema:
                $ref: '#/components/schemas/AsyncFunctionResponse'
  /v1/cases/{caseId}/productionSets:
    post:
      tags:
      - Export
      deprecated: true
      summary: Creates a production set
      description: Use this operation to create a production set in a case. Production sets allow you to manage a set of grouped items for export.
      operationId: createProductionSetDeprecated
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/ProductionSetRequest'
            examples:
              Simple Production Set:
                value:
                  name: MyProductionSet
                  description: This is a production set
                  query: kind:document
                  includeFamilies: false
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/AsyncFunctionResponse'
  /cases/{caseId}/productionSets/{productionSetId}/item/{itemGuid}/printPreview:
    get:
      tags:
      - Export
      summary: Returns a print preview for an item in the production set
      description: Use this operation to return a print preview of the item. If a print preview isn't present on the item, it will be generated.
      operationId: getPrintPreview
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      - name: productionSetId
        in: path
        description: Production set GUID
        required: true
        schema:
          type: string
      - name: itemGuid
        in: path
        description: Item GUID
        required: true
        schema:
          type: string
      - name: pageNumber
        in: query
        description: The page number to be printed
        required: true
        schema:
          type: integer
          format: int32
      - name: generateNew
        in: query
        description: Force regeneration of print preview
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v1+json:
              schema:
                type: array
                items:
                  type: string
                  format: byte
        '404':
          description: Case does not exist
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/ClusteredRestErrorResponse'
              examples:
                Case Does Not Exist:
                  value:
                    serverId: nuix-restful-server-1
                    errorCode: RESOURCE_NOT_FOUND
                    developerMessage: The resource of type 'CASE' and identifier 'ef61c666296e4fc8a0a79288ab697348' could not be found.
                    userMessage: The resource of type 'CASE' and identifier 'ef61c666296e4fc8a0a79288ab697348' could not be found.
                    additionalInfo:
                      rootExceptionClass: com.nuix.us.exception.i18n.I18nNotFoundException
                      rootExceptionMessage: null
                Production Set Does Not Exist:
                  value:
                    serverId: nuix-restful-server-1
                    errorCode: RESOURCE_NOT_FOUND
                    developerMessage: The resource of type 'PRODUCTION_SET' and identifier 'InvalidProductionSetGuid' could not be found.
                    userMessage: The resource of type 'PRODUCTION_SET' and identifier 'InvalidProductionSetGuid' could not be found.
                    additionalInfo:
                      rootExceptionClass: com.nuix.us.exception.i18n.I18nNotFoundException
                      rootExceptionMessage: null
                Item Does Not Exist:
                  value:
                    serverId: nuix-restful-server-1
                    errorCode: RESOURCE_NOT_FOUND
                    developerMessage: The resource of type 'ITEM' and identifier '96c3defc-ee21-4972-9561-d69622c25389' could not be found.
                    userMessage: The resource of type 'ITEM' and identifier '96c3defc-ee21-4972-9561-d69622c25389' could not be found.
                    additionalInfo:
                      rootExceptionClass: com.nuix.us.exception.i18n.I18nNotFoundException
                      rootExceptionMessage: null
  /cases/{caseId}/productionSets/{productionSetId}/items:
    get:
      tags:
      - Export
      summary: Returns the items in this production set
      description: This is a shortcut for using the search endpoint with a production-set-guid:[guid] query
      operationId: getProductionSetItems
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      - name: productionSetId
        in: path
        description: Production set GUID
        required: true
        schema:
          type: string
      - name: startIndex

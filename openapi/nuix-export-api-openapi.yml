        productionSets:
          type: array
          description: The production set GUIDs to export
          items:
            type: string
        productTypes:
          type: array
          description: The list of product types.  Defaults to [ "native" ].
          items:
            type: string
            enum:
            - native
            - text
            - pdf
            - tiff
            - xhtml_report
            - thumbnail
          default:
          - native
        loadFileTypes:
          type: array
          description: The load file types to add to the export.  By default, no load file types are selected

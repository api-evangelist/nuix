openapi: 3.2.0
info:
  title: Nuix REST-API Reference Culling API
  description: 'Welcome to the Nuix REST API documentation. From here you can access all available REST APIs and execute queries against your running REST instance.


    # Authentication Changes


    The `nuix-auth-token` header is being deprecated in favor of standard JWT. The header will be removed in a

    future release. Until the removal of the header, the Nuix REST API will accept the JWT in either the

    `nuix-auth-token` header field or the `Authorization` header field prefixed by `Bearer`.'
  contact:
    name: Nuix
    url: http://forums.nuix.com/
  license:
    name: Licence
    url: https://www.nuix.com/sites/default/files/2023-03/End%20User%20License%20Agreement%20%28Effective%20December%2014%2C%202022%29_1.pdf
  version: ${customer.version}
servers:
- url: /nuix-restful-service/svc
- url: http://localhost:8080/svc
security:
- ApiKeyAuth: []
- bearerAuth: []
tags:
- name: Culling
paths:
  /cases/{caseId}/itemTags:
    post:
      tags:
      - Culling
      summary: Tags query items in bulk
      description: Use this operation to tag all items returned by a query.
      operationId: bulkTag
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v2+json:
            schema:
              $ref: '#/components/schemas/ApplyTagListRequest'
            example:
              query: kind:document
              tagList:
              - mytag1
              - mytag2
      responses:
        '201':
          description: default response
          content:
            application/vnd.nuix.v2+json:
              schema:
                $ref: '#/components/schemas/ApplyTagListResponse'
              example:
                tagList:
                - mytag1
                - mytag2
                successfulTags:
                - mytag1
                - mytag2
                failedTags: []
        '404':
          description: Case does not exist
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/ClusteredRestErrorResponse'
              example:
                serverId: nuix-restful-server-1
                errorCode: RESOURCE_NOT_FOUND
                developerMessage: The resource of type 'CASE' and identifier 'ef61c666296e4fc8a0a79288ab697348' could not be found.
                userMessage: The resource of type 'CASE' and identifier 'ef61c666296e4fc8a0a79288ab697348' could not be found.
                additionalInfo:
                  rootExceptionClass: com.nuix.us.exception.i18n.I18nNotFoundException
                  rootExceptionMessage: null
    delete:
      tags:
      - Culling
      summary: Removes tags from query items in bulk
      description: Use this operation to remove tags from all the items returned by a query.
      operationId: bulkRemoveTag
      deprecated: true
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v2+json:
            schema:
              $ref: '#/components/schemas/ApplyTagListRequest'
            example:
              query: kind:document
              tagList:
              - mytag1
              - mytag2
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v2+json:
              schema:
                $ref: '#/components/schemas/ApplyTagListResponse'
              example:
                tagList:
                - mytag1
                - mytag2
                successfulTags:
                - mytag1
                - mytag2
                failedTags: []
        '404':
          description: Case does not exist
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/ClusteredRestErrorResponse'
              example:
                serverId: nuix-restful-server-1
                errorCode: RESOURCE_NOT_FOUND
                developerMessage: The resource of type 'CASE' and identifier 'ef61c666296e4fc8a0a79288ab697348' could not be found.
                userMessage: The resource of type 'CASE' and identifier 'ef61c666296e4fc8a0a79288ab697348' could not be found.
                additionalInfo:
                  rootExceptionClass: com.nuix.us.exception.i18n.I18nNotFoundException
                  rootExceptionMessage: null
    patch:
      tags:
      - Culling
      summary: Create or remove tags from query items in bulk
      description: Use this operation to create or remove tags in bulk from all the items returned by a query.
      operationId: patchItemTags
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/BulkApplyItemTagListRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/ApplyTagListResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyTagListResponse'
  /cases/{caseId}/tags:
    get:
      tags:
      - Culling
      summary: Returns the set of tags for a case
      description: Use this operation to view the set of tags associated with a case. This is useful when you want to find a group of items that you've tagged or when you want to include the tags as metadata when exporting items. The tag names are returned as a set of strings.
      operationId: getTags
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v1+json:
              schema:
                uniqueItems: true
                type: array
                items:
                  type: string
              example:
              - For Review
              - myCaseTag1
              - myCaseTag2
              - myTag1
              - myTag2
        '404':
          description: Case does not exist
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/ClusteredRestErrorResponse'
              example:
                serverId: nuix-restful-server-1
                errorCode: RESOURCE_NOT_FOUND
                developerMessage: The resource of type 'CASE' and identifier 'ef61c666296e4fc8a0a79288ab697348' could not be found.
                userMessage: The resource of type 'CASE' and identifier 'ef61c666296e4fc8a0a79288ab697348' could not be found.
                additionalInfo:
                  rootExceptionClass: com.nuix.us.exception.i18n.I18nNotFoundException
                  rootExceptionMessage: null
    post:
      tags:
      - Culling
      summary: Creates new tags for a case
      description: Use this operation to create new tags for a case.
      operationId: createTagsForCase
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v2+json:
            schema:
              $ref: '#/components/schemas/TagList'
            example:
              tagList:
              - myCaseTag1
              - myCaseTag2
      responses:
        '201':
          description: default response
          content:
            application/vnd.nuix.v2+json:
              schema:
                $ref: '#/components/schemas/CreateTagListResponse'
              example:
                tagList:
                - myCaseTag1
                - myCaseTag2
                createdTags:
                - myCaseTag1
                - myCaseTag2
                failedTags: []
        '404':
          description: Case does not exist
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/ClusteredRestErrorResponse'
              example:
                serverId: nuix-restful-server-1
                errorCode: RESOURCE_NOT_FOUND
                developerMessage: The resource of type 'CASE' and identifier 'ef61c666296e4fc8a0a79288ab697348' could not be found.
                userMessage: The resource of type 'CASE' and identifier 'ef61c666296e4fc8a0a79288ab697348' could not be found.
                additionalInfo:
                  rootExceptionClass: com.nuix.us.exception.i18n.I18nNotFoundException
                  rootExceptionMessage: null
    delete:
      tags:
      - Culling
      summary: Deletes tags for a case
      description: Use this operation to delete tags for a case. If tags are still applied to an item, the delete operation will fail.
      operationId: deleteTagsForCase
      deprecated: true
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v2+json:
            schema:
              $ref: '#/components/schemas/TagList'
            example:
            - myTag1
            - myTag2
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v2+json:
              schema:
                $ref: '#/components/schemas/DeleteTagListResponse'
              examples:
                Tag Delete Success:
                  value:
                    tagList:
                    - mytag1
                    deletedTags:
                    - mytag1
                    failedTags: []
                Tag Delete Failure:
                  value:
                    tagList:
                    - mytag1
                    deletedTags: []
                    failedTags:
                    - mytag1
        '404':
          description: Case does not exist
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/ClusteredRestErrorResponse'
              example:
                serverId: nuix-restful-server-1
                errorCode: RESOURCE_NOT_FOUND
                developerMessage: The resource of type 'CASE' and identifier 'ef61c666296e4fc8a0a79288ab697348' could not be found.
                userMessage: The resource of type 'CASE' and identifier 'ef61c666296e4fc8a0a79288ab697348' could not be found.
                additionalInfo:
                  rootExceptionClass: com.nuix.us.exception.i18n.I18nNotFoundException
                  rootExceptionMessage: null
    patch:
      tags:
      - Culling
      summary: Create or delete tags for a case in bulk
      description: Use this operation to create, rename, or delete case tags in bulk. If tags are still applied to an item, the delete operation will fail.
      operationId: patchCaseTags
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/BulkApplyCaseTagListRequest'
            examples:
              Create Tags:
                value:
                  operationType: ADD
                  tagList:
                  - MyFirstCaseTag
              Rename Tags:
                value:
                  operationType: RENAME
                  tagList:
                  - MyFirstCaseTag
                  renameMap:
                    MyFirstCaseTag: MyNewCaseTag
              Delete Tags:
                value:
                  operationType: DELETE
                  tagList:
                  - MyNewCaseTag
        required: true
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/ApplyTagListResponse'
              examples:
                Create Tags Response:
                  value:
                    tagList:
                    - MyFirstCaseTag
                    successfulTags:
                    - MyFirstCaseTag
                    failedTags: []
                Rename Tags Response:
                  value:
                    tagList:
                    - MyFirstCaseTag
                    successfulTags:
                    - MyNewCaseTag
                    failedTags: []
                Delete Tags Response:
                  value:
                    tagList:
                    - MyNewCaseTag
                    successfulTags:
                    - MyNewCaseTag
                    failedTags: []
  /cases/{caseId}/excludedItems:
    put:
      tags:
      - Culling
      summary: Excludes items in bulk
      description: Use this operation to flag items as excluded using the exclusion query. Items are tagged with the exclusion reason you provide in the request body as part of the BulkExclusionRequest.
      operationId: bulkExcludeAsFunction
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/BulkExclusionRequest'
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/AsyncFunctionResponse'
  /cases/{caseId}/includedItems:
    put:
      tags:
      - Culling
      summary: Includes items in bulk
      description: Use this operation to remove the exclusion flag from all the items returned by a query.
      operationId: bulkIncludeAsFunction
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/BulkInclusionRequest'
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/AsyncFunctionResponse'
  /cases/{caseId}/clusterRuns:
    post:
      tags:
      - Culling
      summary: Creates a cluster run based on the query provided
      description: 'Use this operation to create a cluster run in a case.


        A cluster run is a group of documents that have been associated based on their

        near-duplicate similarity. Using cluster runs to group similar or related

        documents enables your team to perform a more efficient analysis on an item

        set. For example, you can have the same reviewer examine documents that are

        the most similar or related.'
      operationId: createClusterRun
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterRunRequest'
            example:
              name: MyClusterRun
              query: ''
              resemblanceThreshold: 0.85
              useChainedNearDuplicates: true
              useEmailThreads: false
              saveIfEmpty: true
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/AsyncFunctionResponse'
  /cases/{caseId}/clusterRuns/{clusterRunNameOrGuid}/items:
    get:
      tags:
      - Culling
      summary: Lists items in this cluster run
      description: 'Use this operation to list items in the cluster run. Optional parameters for which cluster, and whether or not the item is a pivot item. Note you may only specify one of the following: clusterNumber, isUnclustered, or isIgnored if any. This is a shortcut operation for querying with the cluster: field.'
      operationId: getClusterRunItems
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      - name: clusterRunNameOrGuid
        in: path
        description: Cluster run name or guid
        required: true
        schema:
          type: string
      - name: startIndex
        in: query
        description: Start index, defaults to 0
        required: false
        schema:
          type: integer
          format: int32
      - name: numberOfRecordsRequested
        in: query
        description: Number of records to return, defaults to 100.
        required: false
        schema:
          type: integer
          format: int32
        example: 100
      - name: clusterNumber
        in: query
        description: Cluster number.
        required: false
        schema:
          type: integer
          format: int32
      - name: isPivot
        in: query
        description: Match pivot items, defaults to all
        required: false
        schema:
          type: boolean
      - name: isUnclustered
        in: query
        description: Matches items that did not cluster, despite being eligible to exist in a cluster.
        required: false
        schema:
          type: boolean
      - name: isIgnored
        in: query
        description: Matches items that were ignored because they were ineligible to exist in a cluster.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/SearchNativeResult'
              example:
                request:
                  caseId: 219f69f5eee14cf6b8c8c15d7cc2dd1e
                  query: cluster:"cluster-run-1;5"
                  sortField: null
                  sortOrder: null
                  startIndex: 0
                  numberOfRecordsRequested: 1
                  deduplicate: null
                  metadataProfile: null
                  fieldList: []
                  customMetadataList: []
                  propertyList: []
                  itemParameterizedFields: []
                  showAvailableThumbnails: false
                  useCache: false
                  forceCacheDelete: false
                  searchRetry: 0
                  relationType: null
                  entities: []
                  p: 1
                  s: 0
                  customMetadataField: []
                  field: []
                  property: []
                startedOn: 1588859051337
                completedOn: 1588859051383
                elapsedTimeForSearch: 41
                elapsedTimeForSort: 0
                elapsedTimeForMarshal: 5
                elapsedTimeForDeduplicate: 0
                elapsedTotal: 46
                metadataItems: []
                localizedMetadataItems: []
                metadataItemDetails: []
                resultList:
                - customMetadata: {}
                  entities: {}
                  guid: 1e623d0a-6c6f-45b2-9931-fb4a49ca4c3d
                  properties: {}
        '400':
          description: 'Bad Request. Note you may only specify one of the following: clusterNumber, isUnclustered, or isIgnored.'
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/ClusteredRestErrorResponse'
              example:
                serverId: nuix-restful-server-1
                errorCode: INVALID_REQUEST_FORMAT
                developerMessage: 'You may only specify one of the following: clusterNumber, isUnclustered, or isIgnored if any.'
                userMessage: null
                additionalInfo: {}
  /cases/{caseId}/clusterRuns/{clusterRunNameOrGuid}:
    delete:
      tags:
      - Culling
      summary: Delete a cluster run
      description: Use this operation to delete a cluster run.
      operationId: deleteClusterRun
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      - name: clusterRunNameOrGuid
        in: path
        description: Cluster run name or guid.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: default response.
        '404':
          description: Case or cluster run resource not found.
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/ClusteredRestErrorResponse'
              examples:
                Case Not Found:
                  value:
                    serverId: nuix-restful-server-1
                    errorCode: RESOURCE_NOT_FOUND
                    developerMessage: The resource of type 'CASE' and identifier 'ef61c666296e4fc8a0a79288ab697348' could not be found.
                    userMessage: The resource of type 'CASE' and identifier 'ef61c666296e4fc8a0a79288ab697348' could not be found.
                    additionalInfo:
                      rootExceptionClass: com.nuix.us.exception.i18n.I18nNotFoundException
                      rootExceptionMessage: null
                Cluster Run Not Found:
                  value:
                    serverId: nuix-restful-server-1
                    errorCode: RESOURCE_NOT_FOUND
                    developerMessage: The resource of type 'CLUSTER_RUN' and identifier 'unknownClusterRun' could not be found.
                    userMessage: The resource of type 'CLUSTER_RUN' and identifier 'unknownClusterRun' could not be found.
                    additionalInfo:
                      rootExceptionClass: com.nuix.us.exception.i18n.I18nNotFoundException
                      rootExceptionMessage: null
  /cases/{caseId}/bulkSearchers:
    post:
      tags:
      - Culling
      summary: Generate a count report and optionally tag items
      description: Use this operation to create a count report and optionally tag individual items.
      operationId: bulkSearchers
      parameters:
      - name: caseId
        in: path
        description: caseId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/BulkSearcherRequest'
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/AsyncFunctionResponse'
        '400':
          description: Bad Request. A list of tag requests are required to use bulk search.
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/ClusteredRestErrorResponse'
              example:
                serverId: nuix-restful-server-1
                errorCode: INVALID_REQUEST_FORMAT
                developerMessage: A list of tag requests are required to use bulk search.
                userMessage: null
                additionalInfo: {}
  /cases/{caseId}/exclusions:
    get:
      tags:
      - Culling
      summary: Returns exclusions for a case
      description: Use this operation to view the set of exclusions associated with a case.
      operationId: getExclusions
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v1+json:
              schema:
                uniqueItems: true
                type: array
                items:
                  type: string
  /cases/{caseId}/items/{itemGuid}/customMetadata:
    get:
      tags:
      - Culling
      summary: Returns custom metadata for an item
      description: Use this operation to retrieve custom metadata from an item in a case.
      operationId: getCustomMetadata
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      - name: itemGuid
        in: path
        description: Item GUID
        required: true
        schema:
          type: string
      - name: fieldNameFilter
        in: query
        description: Field name filter.  Filters metadata fields that are returned.  Fields that do not match the regular expression are removed by the filter.
        required: false
        schema:
          type: string
      - name: typeFilter
        in: query
        description: Type filter.  Filters metadata fields that are returned.  Fields that do not match the type are removed by the filter.
        required: false
        schema:
          type: string
      - name: modeFilter
        in: query
        description: Mode filter.  Filters metadata fields that are returned.  Fields that do not match the mode are removed by the filter.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v1+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomMetadataResponse'
    put:
      tags:
      - Culling
      summary: Applies custom metadata to an item
      description: 'Use this operation to apply custom metadata to an item.


        Most custom metadata is put with a mode of "user", indicating that it is user-level. Mode "api" should only be used where you are setting system-level specific metadata, which is not visible in the GUI by default. If using "api" mode we strongly recommend you include a unique prefix to your fieldname to avoid possible collisions with user-level custom metadata, e.g. "com.your-company.rule-set.fieldName".


        This subclass additionally supports binary custom metadata fields. To store binary custom metadata:


        type must be "binary".

        mode must be "api" (only API mode is currently supported).

        params must contain a key "mimeType" with value being the MIME type of the binary data being stored.'
      operationId: addCustomMetadata
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      - name: itemGuid
        in: path
        description: Item GUID
        required: true
        schema:
          type: string
      - name: applyToFamily
        in: query
        description: Apply metadata to family items
        required: false
        schema:
          type: boolean
          default: false
      - name: applyToDuplicates
        in: query
        description: Apply metadata to duplicates
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/CustomMetadataRequest'
      responses:
        '200':
          description: default response
    delete:
      tags:
      - Culling
      summary: Removes custom metadata on an item
      description: Use this operation to remove custom metadata from an item.
      operationId: deleteCustomMetadata
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      - name: itemGuid
        in: path
        description: Item GUID
        required: true
        schema:
          type: string
      - name: applyToFamily
        in: query
        description: Remove metadata from family items
        required: false
        schema:
          type: boolean
          default: false
      - name: applyToDuplicates
        in: query
        description: Remove metadata from duplicates
        required: false
        schema:
          type: boolean
          default: false
      - name: fieldName
        in: query
        description: Field name
        required: true
        schema:
          type: string
      responses:
        '204':
          description: default response
  /cases/{caseId}/itemCustomMetadata:
    post:
      tags:
      - Culling
      summary: Applies custom metadata to items in bulk
      description: 'Use this operation to apply custom metadata to items in.


        Most custom metadata is put with a mode of "user", indicating that it is user-level. Mode "api" should only be used where you are setting system-level specific metadata, which is not visible in the GUI by default. If using "api" mode we strongly recommend you include a unique prefix to your fieldname to avoid possible collisions with user-level custom metadata, e.g. "com.your-company.rule-set.fieldName".


        This subclass additionally supports binary custom metadata fields. To store binary custom metadata:


        type must be "binary".

        mode must be "api" (only API mode is currently supported).

        params must contain a key "mimeType" with value being the MIME type of the binary data being stored.'
      operationId: bulkAddCustomMetadata
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/BulkItemCustomMetadataRequest'
      responses:

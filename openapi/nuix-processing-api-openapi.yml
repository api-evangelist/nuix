        accessToken:
          type: string
          description: A string retrieved using the authCode that enables access to an account. For dropbox, if the access token to an account is already known, provide it directly using this parameter instead of authCode. This code doesn't expire unless the account owner revokes access for Nuix.
    IngestibleSlack:
      type: object
      properties:
        tempAuthCode:
          type: string
          description: The temporary authorization code obtained from Slack's OAuth flow. Not required if storedCredentialName is provided.
        storedCredentialName:
          type: string
          description: The name of the slack credentials stored in credentials store. Not required if tempAuthCode is provided.
        from:
          type: string
          format: date-time
          description: Sets the start date on the location. The start date and end date are both required, and if retrievals(Collection) includes USERS_CALENDARS or TEAMS_CALENDARS, then the date range cannot exceed five years.  Accepted date formats are RFC-3339 or a simple date format (yyyy-MM-dd) which will use the default timezone of the server.
        to:
          type: string
          format: date-time
          description: Sets the end date on the location. The start date and end date are both required, and if retrievals(Collection) includes USERS_CALENDARS or TEAMS_CALENDARS, then the date range cannot exceed five years.  Accepted date formats are RFC-3339 or a simple date format (yyyy-MM-dd) which will use the default timezone of the server.
        userIds:
          type: array
          description: The Set of user IDs to filter Slack messages and files from.
          items:
            type: string

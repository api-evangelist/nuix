        oracleServers:
          type: array
          description: A list of ingestible Oracle servers to ingest.
          items:
            $ref: '#/components/schemas/IngestibleOracleServer'
        enterpriseVaults:
          type: array
          description: A list of ingestible enterprise vaults to ingest.
          items:
            $ref: '#/components/schemas/IngestibleEnterpriseVault'
        sharepointSites:
          type: array
          description: A list of ingestible sharepoint sites to ingest.
          items:
            $ref: '#/components/schemas/IngestibleSharepoint'
        mailStores:
          type: array

notes:
  core_engine_rest: Log in with PUT /v1/authenticatedUsers/login (username, password, optional licenceShortName
    and workers); the returned authToken "will need to be submitted in the nuix-auth-token request header field
    on all subsequent requests". If licence and workers are omitted "any license will be selected and 1 worker will
    be granted". Release 9.10.44 added a form-encoded (application/x-www-form-urlencoded) login endpoint for passwords
    containing special characters.
  ecc_rest: All requests must authenticate using the Authentication header (RFC 7235). Basic (RFC 7617) against
    ECC's internal user directory, for a user with the "Login high-level API" option and a role granting Manage
    existing jobs / Create new collections / Manage templates and configurations; or Bearer (RFC 6750) with an access
    token from Keycloak (password grant, client_id "ECC") or Azure AD (client_credentials, scope api://{client_id}/.default).
    Obtaining the token is the calling application's responsibility.
  self_hosted: Both APIs run on customer-installed servers (Core Engine REST at /nuix-restful-service/svc, ECC at
    {protocol}://{address}:{port}/api/ecc); there is no Nuix-hosted endpoint.

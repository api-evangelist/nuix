source: 'Derived from openapi/nuix-core-engine-rest-api-openapi.yml and the ECC per-tag specs under openapi/.
  Searched 2026-10-21 for an official Nuix MCP server (web search "Nuix MCP server Model Context Protocol":
  no Nuix result; https://dev.nuix.com/.well-known/mcp.json 404; https://dev.nuix.com/llms.txt (200) does
  not mention MCP).'
deployment:
  mode: none
  auth: unknown
  verified: derived
notes: 'Nuix publishes no MCP server. Both Nuix REST surfaces are self-hosted (Nuix REST service at /nuix-restful-service/svc
  or localhost:8080/svc; ECC at {protocol}://{address}:{port}/api/ecc), so any server would be run by
  the customer against their own installation. Auth per the specs: ApiKeyAuth/bearerAuth (core engine,
  licence acquired via login) and HTTP Basic (ECC). Login/auth operations are intentionally excluded from
  the tool list.'

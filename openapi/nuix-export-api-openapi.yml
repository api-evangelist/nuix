            type: string
            enum:
            - concordance
            - summation
            - discovery_radar
            - documatrix
            - edrm_xml
            - ipro
            - ringtail
            - xhtml_summary_report
            - csv_summary_report
        queries:
          type: array
          description: The list of queries to export.  Only applicable for ITEM exports
          items:
            type: string
        exportType:
          type: string
          description: Defaults to ITEM
          enum:
          - item
          - legal
          default: item
        path:
          type: string
          description: Root export path folder
        exportOptions:
          $ref: '#/components/schemas/ExportOptions'
        parallelProcessingSettings:
          $ref: '#/components/schemas/ParallelProcessingSettings'

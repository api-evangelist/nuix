openapi: 3.2.0
info:
  title: Nuix REST-API Reference Processing API
  description: 'Welcome to the Nuix REST API documentation. From here you can access all available REST APIs and execute queries against your running REST instance.


    # Authentication Changes


    The `nuix-auth-token` header is being deprecated in favor of standard JWT. The header will be removed in a

    future release. Until the removal of the header, the Nuix REST API will accept the JWT in either the

    `nuix-auth-token` header field or the `Authorization` header field prefixed by `Bearer`.'
  contact:
    name: Nuix
    url: http://forums.nuix.com/
  license:
    name: Licence
    url: https://www.nuix.com/sites/default/files/2023-03/End%20User%20License%20Agreement%20%28Effective%20December%2014%2C%202022%29_1.pdf
  version: ${customer.version}
servers:
- url: /nuix-restful-service/svc
- url: http://localhost:8080/svc
security:
- ApiKeyAuth: []
- bearerAuth: []
tags:
- name: Processing
paths:
  /cases/{caseId}/keyStores:
    get:
      tags:
      - Processing
      summary: Returns a list of keystore files available for a case
      description: Returns a list of keystore files available for a case.
      operationId: getCaseKeystores
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
        example:
        - /opt/nuix/nuix-restful-service/cases/MyCase/keystores
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v1+json:
              schema:
                type: array
                items:
                  type: string
              example:
              - mykeystore
    post:
      tags:
      - Processing
      summary: Adds a keystore to a case
      description: 'Uploads a keystore file to the cases directory.Currently supported key files are: PGP keyrings and collections - ACSII-armoured and binary (used for PGP decryption), PKCS#12 (used for S/MIME decryption), and Lotus Notes ID files which are associated with NSF files found in evidence'
      operationId: addKeyStoreToCase
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                keystoreFile:
                  type: string
                  format: binary
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/Success'
              example:
                success: true
        '409':
          description: A keystore file with the same filename already exists.
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/ClusteredRestErrorResponse'
              example:
                serverId: nuix-restful-server-1
                userMessage: A keystore file with that name was already uploaded to this case.
                additionalInfo: null
                errorCode: FOLDER_ALREADY_EXISTS
                developerMessage: A user attempted to upload a file, while another file with this name already existed.
        '413':
          description: The size of the request exceeds the maximum size.
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/ClusteredRestErrorResponse'
              example:
                serverId: nuix-restful-server-1
                errorCode: FILE_TOO_LARGE
                developerMessage: 'Could not parse multipart servlet request; nested exception is java.lang.IllegalStateException: org.apache.tomcat.util.http.fileupload.FileUploadBase$SizeLimitExceededException: the request was rejected because its size (3260299650) exceeds the configured maximum (10485760)"

                  '
                userMessage: null
                additionalInfo:
                  rootExceptionClass: org.springframework.web.multipart.MultipartException
                  rootExceptionMessage: 'Could not parse multipart servlet request; nested exception is java.lang.IllegalStateException: org.apache.tomcat.util.http.fileupload.FileUploadBase$SizeLimitExceededException: the request was rejected because its size (3260299650) exceeds the configured maximum (10485760)"

                    '
    delete:
      tags:
      - Processing
      summary: Deletes the requested keystore from the case's keystore directory
      description: Deletes the requested keystore from the case's keystore directory. All keystores are deleted if the fileToDeleteRegex query parameter is not included.
      operationId: deleteKeystoreFromCase
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      - name: fileToDeleteRegex
        in: query
        description: fileToDeleteRegex
        required: false
        schema:
          type: string
          default: .*
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/Success'
              example:
                success: true
  /cases/{caseId}/evidence:
    post:
      tags:
      - Processing
      summary: Ingests a new repository and/or supported containers into a simple case
      description: 'Use this operation to ingest different types of data during a single

        processing session. This operation is useful to ingest multiple containers

        using one call rather than having to call multiple operations for each individual

        container.'
      operationId: bulkIngestionIntoSimpleCase
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/BulkIngestionRequest'
            examples:
              File and S3 Bucket Ingestion:
                value:
                  processingProfile: Default
                  containers:
                  - files:
                    - path: /mnt/raw-data/singleFile.txt
                    - path: /mnt/raw-data/directory
                    s3Buckets:
                    - access: AWSACCESSKEY
                      bucket: my.aws.bucket/bucketFolder
                      endpoint: ''
                      secret: AWSSECRETACCESSKEY
      responses:
        '200':
          description: default response
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/AsyncFunctionResponse'
  /cases/{caseId}/evidence/repository:
    post:
      tags:
      - Processing
      summary: Ingests a directory and creates a repository in a simple case
      description: 'Use this operation to ingest a single directory into a simple case

        as an evidence repository. Adding evidence as a repository allows the evidence

        to be re-scanned at a future point and any new files added to the repository

        to be indexed in addition to the originally indexed evidence.'
      operationId: ingestRepoIntoSimpleCase
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/SingleRepositoryIngestionRequest'
            examples:
              Simple Evidence Repository Ingestion:
                value:
                  repository:
                    path: /mnt/repositories
      responses:
        '200':
          description: default response
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/AsyncFunctionResponse'
  /cases/{caseId}/evidence/file:
    post:
      tags:
      - Processing
      summary: Ingests a new file/directory target into a container in a simple case
      description: Use this operation to ingest a single file or directory during a processing session.
      operationId: ingestFileIntoSimpleCase
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/SingleContainerIngestionRequestIngestibleFile'
            examples:
              Simple File Ingestion:
                value:
                  target:
                    path: /mnt/raw-data/singleFile.txt
      responses:
        '200':
          description: default response
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/AsyncFunctionResponse'
  /cases/{caseId}/evidence/loadFile:
    post:
      tags:
      - Processing
      summary: Ingests a new load file target into a container within a simple case
      description: 'Use this operation to ingest a single type of data from a single

        source during a processing session. This endpoint currently supports loadfiles

        in CSV format.'
      operationId: ingestLoadFileIntoSimpleCase
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/SingleContainerIngestionRequestIngestibleLoadFile'
            examples:
              Simple Loadfile Ingestion:
                value:
                  target:
                    path: /mnt/loadfile.csv
      responses:
        '200':
          description: default response
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/AsyncFunctionResponse'
  /cases/{caseId}/evidence/mail:
    post:
      tags:
      - Processing
      summary: Ingests a new mail target into a container in a simple case
      description: Use this operation to ingest an individual mail store into a simple case. This is useful when you want to ingest non-Microsoft Exchange targets.
      operationId: ingestMailstoreIntoSimpleCase
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/SingleContainerIngestionRequestIngestibleMailStore'
            examples:
              GMail IMAP Ingestion:
                value:
                  target:
                    protocol: imap
                    host: imap.gmail.com
                    port: 993
                    username: myuser
                    password: mypassword
      responses:
        '200':
          description: default response
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/AsyncFunctionResponse'
  /cases/{caseId}/evidence/exchange:
    post:
      tags:
      - Processing
      summary: Ingests a new Exchange target into a container in a simple case
      description: Use this operation to ingest an Exchange account or a Microsoft Exchange email mailbox into a simple case.
      operationId: ingestExchangeIntoSimpleCase
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/SingleContainerIngestionRequestIngestibleExchangeMailbox'
            examples:
              Simple Exchange Ingestion:
                value:
                  target:
                    mailboxRetrieval:
                    - mailbox
                    uri: https://outlook.office365.com/ews/exchange.asmx
                    username: yourusername
                    password: yourpassword
                    impersonating: false
      responses:
        '200':
          description: default response
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/AsyncFunctionResponse'
  /cases/{caseId}/evidence/sharepoint:
    post:
      tags:
      - Processing
      summary: Ingests a new SharePoint target into a container within a simple case
      description: Use this operation to ingest a single type of data from one source during a processing session.
      operationId: ingestSharepointIntoSimpleCase
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/SingleContainerIngestionRequestIngestibleSharepoint'
            examples:
              Simple Sharepoint Ingestion:
                value:
                  target:
                    domain: mydomain.sharepoint.com
                    username: myuser
                    password: mypassword
                    uri: domain.sharepoint.com/sites/mypage
      responses:
        '200':
          description: default response
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/AsyncFunctionResponse'
  /cases/{caseId}/evidence/sql:
    post:
      tags:
      - Processing
      summary: Ingests a new SQL target into a container in a simple case
      description: Use this operation to ingest a single type of data from one source during a processing session.
      operationId: ingestSqlIntoSimpleCase
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/SingleContainerIngestionRequestIngestibleSQLServer'
            examples:
              Simple SQL Server Ingestion:
                value:
                  target:
                    username: myuser
                    password: mypassword
                    computer: myServerAddress
                    instance: myDatabase
      responses:
        '200':
          description: default response
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/AsyncFunctionResponse'
  /cases/{caseId}/evidence/oracle:
    post:
      tags:
      - Processing
      summary: Ingests a new Oracle target into a container in a simple case
      description: Use this operation to ingest a single type of data from one source during a processing session.
      operationId: ingestOracleIntoSimpleCase
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/SingleContainerIngestionRequestIngestibleOracleServer'
            examples:
              Simple Oracle Server Ingestion:
                value:
                  target:
                    driverType: thin
                    password: mypassword
                    username: myusername
                    database: host:port
                    role: SYSDBA
      responses:
        '200':
          description: default response
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/AsyncFunctionResponse'
  /cases/{caseId}/evidence/ev:
    post:
      tags:
      - Processing
      summary: Ingests a new enterprise vault target into a container in a simple case
      description: 'Use this operation to ingest a single type of data from a Enterprise

        Vault archiving system. Enterprise Vault is an on-premise data archiving platform

        produced by Symantec Corporation.'
      operationId: ingestEnterpriseVaultIntoSimpleCase
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/SingleContainerIngestionRequestIngestibleEnterpriseVault'
            examples:
              Simple Enterprise Vault Ingestion:
                value:
                  target:
                    computer: MyEnterpriseVaultServer
                    vault: MyVaultId
      responses:
        '200':
          description: default response
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/AsyncFunctionResponse'
  /cases/{caseId}/evidence/s3:
    post:
      tags:
      - Processing
      summary: Ingests a new S3 target into a container in a simple case
      description: Use this operation to ingest a single type of data from one source during a processing session.
      operationId: ingestS3IntoSimpleCase
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/SingleContainerIngestionRequestIngestibleS3Bucket'
            examples:
              Sample S3 Bucket Ingestion:
                value:
                  target:
                    access: AWSACCESSKEY
                    bucket: my.aws.bucket/bucketFolder
                    endpoint: ''
                    secret: AWSSECRETACCESSKEY
      responses:
        '200':
          description: default response
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/AsyncFunctionResponse'
  /cases/{caseId}/evidence/centera:
    post:
      tags:
      - Processing
      summary: Ingests a new Centera target into a container in a simple case
      description: Use this operation to ingest a single type of data from a Centera archiving system. Centera is a content-addressable storage platform for data archiving produced by EMC Corporation.
      operationId: ingestCenteraIntoSimpleCase
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/SingleContainerIngestionRequestIngestibleCenteraCluster'
            examples:
              Simple Centera Cluster Ingestion:
                value:
                  target:
                    ipsFile: /mnt/centera/ipsFile
                    clipsFile: /mnt/centera/clipsFile
      responses:
        '200':
          description: default response
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/AsyncFunctionResponse'
  /cases/{caseId}/evidence/splitFiles:
    post:
      tags:
      - Processing
      summary: Ingests a new split file list target into a container in a simple case
      description: Use this operation to ingest a single type of data from one source during a processing session. This can be used to load files which have been split using ordinary splitting tools, which is common for raw ("dd") disk images.
      operationId: ingestSplitFilesIntoSimpleCase
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/SingleContainerIngestionRequestIngestibleSplitFileList'
            examples:
              Simple Split Files Ingestion:
                value:
                  target:
                    files:
                    - /mnt/splitFile1
                    - /mnt/splitFile2
      responses:
        '200':
          description: default response
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/AsyncFunctionResponse'
  /cases/{caseId}/evidence/dropbox:
    post:
      tags:
      - Processing
      summary: Ingests a new Dropbox target into a container in a simple case
      description: Use this operation to ingest a single type of data from one source during a processing session.
      operationId: ingestDropboxIntoSimpleCase
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/SingleContainerIngestionRequestIngestibleDropbox'
            examples:
              Simple Dropbox Ingestion:
                value:
                  target:
                    authCode: DROPBOXAUTHCODE
                    team: true
                    accessToken: DROPBOXACCESSTOKEN
      responses:
        '200':
          description: default response
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/AsyncFunctionResponse'
  /cases/{caseId}/evidence/ssh:
    post:
      tags:
      - Processing
      summary: Ingests a new SSH-based target into a container in a simple case
      description: Use this operation to ingest a single type of data from one source during a processing session.
      operationId: ingestSSHIntoSimpleCase
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/SingleContainerIngestionRequestIngestibleSSH'
            examples:
              SSH Ingestion Username/Password:
                value:
                  target:
                    computer: MyServerName
                    username: myUserName
                    password: myPassword
                    port: 22
                    remoteFolder: /mnt/data
              SSH Ingestion Authentication Key:
                value:
                  target:
                    computer: MyServerName
                    username: myUserName
                    keyFolder: /home/user/.ssh/id_rsa
                    port: 22
                    remoteFolder: /mnt/data
      responses:
        '200':
          description: default response
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/AsyncFunctionResponse'
  /cases/{caseId}/evidence/twitter:
    post:
      tags:
      - Processing
      summary: Ingests a new historical twitter target into a container in a simple case
      description: Use this operation to ingest a single type of data from one source during a processing session.
      operationId: ingestTwitterIntoSimpleCase
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/SingleContainerIngestionRequestIngestibleTwitter'
            examples:
              Simple Historical Twitter Ingestion:
                value:
                  target:
                    consumerKey: consumerKey
                    consumerSecret: consumerSecret
                    accessToken: accessToken
                    accessTokenSecret: accessTokenSecret
      responses:
        '200':
          description: default response
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/AsyncFunctionResponse'
  /cases/{caseId}/evidence/ms365:
    post:
      tags:
      - Processing
      summary: Ingests a new Microsoft 365 target into a container in a simple case
      description: Use this operation to ingest a single type of data from one source during a processing session.
      operationId: ingestMs365IntoSimpleCase
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/SingleContainerIngestionRequestIngestibleMicrosoft365'
            examples:
              Simple Microsoft 365 Ingestion:
                value:
                  target:
                    tenantId: tenantId
                    clientId: clientId
                    clientSecret: clientSecret
                    from: '2021-01-01'
                    to: '2021-04-30'
                    username: username
                    password: password
                    userPrincipalNames:
                    - userprincipal@domain.com
                    retrievals:
                    - USERS_CONTACTS
      responses:
        '200':
          description: default response
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/AsyncFunctionResponse'
  /cases/{caseId}/evidence/slack:
    post:
      tags:
      - Processing
      summary: Ingests a new Slack target into a container in a simple case
      description: Use this operation to ingest a single type of data from one source during a processing session.
      operationId: ingestSlackIntoSimpleCase
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/SingleContainerIngestionRequestIngestibleSlack'
            examples:
              Simple Slack Ingestion:
                value:
                  target:
                    tempAuthCode: '23432421'
                    storedCredentialName: null
                    from: '2021-01-01'
                    to: '2021-04-30'
                    userIds:
                    - '1244'
      responses:
        '200':
          description: default response
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/AsyncFunctionResponse'
  /cases/{caseId}/evidence/documentum:
    post:
      tags:
      - Processing
      summary: Ingests a new Documentum target into a container in a simple case
      description: Use this operation to ingest a single type of data from one source during a processing session.
      operationId: ingestDocumentumIntoSimpleCase
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/SingleContainerIngestionRequestIngestibleDocumentum'
            examples:
              Simple Documentum Ingestion:
                value:
                  target:
                    username: myuser
                    password: mypassword
                    domain: domain
                    port: 1489
                    query: query
                    server: server
                    docBase: docBaseRepository
      responses:
        '200':
          description: default response
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/AsyncFunctionResponse'
  /cases/{caseId}/items:
    put:
      tags:
      - Processing
      summary: Reloads items from source based on a query in a simple case
      description: Use this operation to reload items from source.
      operationId: reloadItemsFromSourceIntoSimpleCase
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/ReloadItemsIngestionRequest'
            examples:
              Reload All Items:
                value:
                  query: '*'
      responses:
        '200':
          description: default response
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/AsyncFunctionResponse'
  /cases/{caseId}/items/ocr:
    put:
      tags:
      - Processing
      summary: Performs OCR on query items
      description: 'Use this operation to perform bulk optical character recognition

        (OCR) on items returned from a query. This is done using OCR and imaging options.

        The Nuix OCR add-on must be installed. For example, you can OCR an image with

        a query to extract item text.'
      operationId: bulkOcrItemsAsFunctionV2
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v2+json:
            schema:
              $ref: '#/components/schemas/OcrRequestV2'
            examples:
              Simple OCR Request:
                value:
                  query: 'kind: spreadsheet'
                  ocrOptions:
                    quality: document_archiving_speed
                    ocrImagingOptions:
                      excelExportingEngine: MS_OFFICE
          application/vnd.nuix.v1+json:
            schema:

  /cases/{caseId}/itemShingles:
    put:
      tags:
      - Analysis
      summary: Calculates the number of shingles associated with a case's items
      description: 'Use this operation to see how many shingles are associated with

        the items in a case. This operation starts an asynchronous task to count the

        shingles.


        Shingling enables you to find near-duplicate items by extracting the textual essence from each document and applying that pattern to a data set

        to find similar documents. Each shingle, or pattern, generally consists of a phrase of 5 or 6 words. For example, you could use shingling

        to find the Word document that a PDF was created from. The binary makeup of the documents is different, but the content is the same.'
      operationId: getItemsShingles
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/ItemsShinglesRequest'
            example:
              query: kind:document
              deduplication: md5
              maxItems: 5
              maxShingleResponse: 5
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/AsyncFunctionResponse'
              example:
                functionKey: 1277e4ce-a1dd-421a-b4e0-41c40404908a
                location: http://localhost:8080/svc/v1/asyncFunctions/1277e4ce-a1dd-421a-b4e0-41c40404908a

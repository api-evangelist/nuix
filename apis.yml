aid: nuix

name: Nuix

description: Nuix is a provider of investigative analytics and intelligence software that delivers data privacy, fraud and investigations, and
  legal eDiscovery solutions (Nuix Neo, Nuix Workstation, Nuix Discover, Nuix Adaptive Security). Developers integrate through the Nuix Engine
  SDK documented at developer.nuix.com, the GraphQL-based Nuix Discover Connect API, and the self-hosted Nuix Adaptive Security REST API for endpoint
  collection, cases, jobs and targets.


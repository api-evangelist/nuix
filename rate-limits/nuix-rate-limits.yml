description: Nuix publishes no request rate limits for its self-hosted REST APIs and documents no rate-limit response
  headers. Capacity is bounded by licensed workers granted at login (PUT /v1/authenticatedUsers/login, "workers").
  The only published numeric guidance is a worker recommendation for Office 365 ingestion, below, which protects
  against Microsoft Graph throttling rather than a Nuix limit.

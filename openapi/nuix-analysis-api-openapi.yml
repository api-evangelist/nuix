openapi: 3.2.0
info:
  title: Nuix REST-API Reference Analysis API
  description: 'Welcome to the Nuix REST API documentation. From here you can access all available REST APIs and execute queries against your running REST instance.


    # Authentication Changes


    The `nuix-auth-token` header is being deprecated in favor of standard JWT. The header will be removed in a

    future release. Until the removal of the header, the Nuix REST API will accept the JWT in either the

    `nuix-auth-token` header field or the `Authorization` header field prefixed by `Bearer`.'
  contact:
    name: Nuix
    url: http://forums.nuix.com/
  license:
    name: Licence
    url: https://www.nuix.com/sites/default/files/2023-03/End%20User%20License%20Agreement%20%28Effective%20December%2014%2C%202022%29_1.pdf
  version: ${customer.version}
servers:
- url: /nuix-restful-service/svc
- url: http://localhost:8080/svc
security:
- ApiKeyAuth: []
- bearerAuth: []
tags:
- name: Analysis
paths:
  /cases/{caseId}/clusterRuns:
    get:
      tags:
      - Analysis
      summary: Returns the cluster runs for a case
      description: Use this operation to view the cluster runs associated with a case. A cluster run is a group of documents that have been associated based on their near-duplicate similarity. Using cluster runs to group similar or related documents enables your team to perform a more efficient analysis on an item set. For example, you can have the same reviewer examine documents that are the most similar or related.
      operationId: getClusterRuns
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v1+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClusterRunResponse'
              example:
              - clusterName: MyClusterRun
                clusters:
                - ignored
                - unclustered
                - 1
                - 2
                - 3
                resemblanceThreshold: 0.85
                useChainedNearDuplicatesEnabled: true
                useEmailThreadsEnabled: false
  /cases/{caseId}/domains:
    get:
      tags:
      - Analysis
      summary: Returns the set of communication domains in a case
      description: Use this operation to view the communication domains associated with a case. Allowable values for addressType are internet_mail, phone, and instant_message. This is useful for analysis and analytics. The domains are returned as a set of strings.
      operationId: getDomains
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      - name: addressType
        in: query
        description: The type of contact address
        required: true
        schema:
          type: string
          enum:
          - internet_mail
          - phone
          - instant_message
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v1+json:
              schema:
                uniqueItems: true
                type: array
                items:
                  type: string
              example:
              - gmail.com
  /cases/{caseId}/markupSets:
    get:
      tags:
      - Analysis
      summary: Gets all MarkupSets for the given case
      description: Use this operation to get a list of all MarkupSets in the current case.
      operationId: getMarkupSets
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v1+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarkupSet'
              example:
              - redactionReason: The reason for the redaction.
                name: MyMarkupSet
                description: This is a markup set.
    post:
      tags:
      - Analysis
      summary: Create a markup set
      description: Use this operation to create a new markup set.
      operationId: createMarkupSet
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/MarkupSetRequest'
            example:
              description: This is a markup set.
              redactionReason: The reason for the redaction.
        required: true
      responses:
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ClusteredRestErrorResponse'
        '409':
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ClusteredRestErrorResponse'
        '502':
          description: Bad Gateway
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ClusteredRestErrorResponse'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ClusteredRestErrorResponse'
        '415':
          description: Unsupported Media Type
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ClusteredRestErrorResponse'
        '406':
          description: Not Acceptable
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ClusteredRestErrorResponse'
        '405':
          description: Method Not Allowed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ClusteredRestErrorResponse'
        '413':
          description: Payload Too Large
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ClusteredRestErrorResponse'
        '201':
          description: Created
          content:
            application/vnd.nuix.v2+json:
              schema:
                $ref: '#/components/schemas/MarkupSet'
            application/json:
              schema:
                $ref: '#/components/schemas/MarkupSet'
  /cases/{caseId}/markupSet:
    get:
      tags:
      - Analysis
      summary: Gets all MarkupSets for the given case
      description: Use this operation to get a list of all MarkupSets in the current case.
      operationId: getMarkupSetDeprecated
      deprecated: true
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v1+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarkupSet'
              example:
              - redactionReason: The reason for the redaction.
                name: MyMarkupSet
                description: This is a markup set.
  /cases/{caseId}/itemTypes:
    get:
      tags:
      - Analysis
      summary: Returns item kinds and types for a case
      description: 'Use this operation to view the item kinds and types associated

        with a case. You can also request counts along with a filtering query. Item

        types are modeled on MIME types. For example, an item kind could be a document

        and the item type could be a PDF.'
      operationId: getItemTypes
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      - name: includeCounts
        in: query
        description: Include count totals for the types
        required: false
        schema:
          type: boolean
          default: false
      - name: query
        in: query
        description: Query items that should be included. If a query is not supplied it defaults to an empty string, which returns all items.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v1+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KindTypeResponse'
              example:
                itemKind: document
                itemTypes:
                - name: application/pdf
                  localisedName: Portable Document Format
                  kind: document
                  preferredExtension: pdf
                  count: 11
  /cases/{caseId}/reviewJobs/{reviewJobNameOrGuid}:
    get:
      tags:
      - Analysis
      summary: Returns details for a review job
      description: Use this operation to see the list of review jobs for a case. All jobs are returned including fast review jobs. In these jobs, reviewers are assigned directly to a job, enabling a systematic review.
      operationId: getReviewJob
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      - name: reviewJobNameOrGuid
        in: path
        description: Review job name or GUID.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/ReviewJobResponse'
              example:
              - name: MyFastReviewJob
                guid: 9a6ae288-aa23-44e5-ba6b-f88f588ebbc3
        '404':
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusteredRestErrorResponse'
              examples:
                Case Does Not Exist:
                  value:
                    serverId: nuix-restful-server-1
                    errorCode: RESOURCE_NOT_FOUND
                    developerMessage: The resource of type 'CASE' and identifier 'ef61c666296e4fc8a0a79288ab697348' could not be found.
                    userMessage: The resource of type 'CASE' and identifier 'ef61c666296e4fc8a0a79288ab697348' could not be found.
                    additionalInfo:
                      rootExceptionClass: com.nuix.us.exception.i18n.I18nNotFoundException
                      rootExceptionMessage: null
                Invalid Job Review Name:
                  value:
                    serverId: nuix-restful-server-1
                    errorCode: RESOURCE_NOT_FOUND
                    developerMessage: The resource of type 'REVIEW_JOB' and identifier 'unknownReviewJob' could not be found.
                    userMessage: The resource of type 'REVIEW_JOB' and identifier 'unknownReviewJob' could not be found.
                    additionalInfo:
                      rootExceptionClass: com.nuix.us.exception.i18n.I18nNotFoundException
                      rootExceptionMessage: null
    delete:
      tags:
      - Analysis
      summary: Deletes a review job
      description: Use this operation to delete a review job for a case.
      operationId: deleteReviewJob
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      - name: reviewJobNameOrGuid
        in: path
        description: Review job name or guid.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: default response
        '404':
          description: error response
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/ClusteredRestErrorResponse'
              examples:
                Case Does Not Exist:
                  value:
                    serverId: nuix-restful-server-1
                    errorCode: RESOURCE_NOT_FOUND
                    developerMessage: The resource of type 'CASE' and identifier 'ef61c666296e4fc8a0a79288ab697348' could not be found.
                    userMessage: The resource of type 'CASE' and identifier 'ef61c666296e4fc8a0a79288ab697348' could not be found.
                    additionalInfo:
                      rootExceptionClass: com.nuix.us.exception.i18n.I18nNotFoundException
                      rootExceptionMessage: null
                Invalid Job Review Name:
                  value:
                    serverId: nuix-restful-server-1
                    errorCode: RESOURCE_NOT_FOUND
                    developerMessage: The resource of type 'REVIEW_JOB' and identifier 'unknownReviewJob' could not be found.
                    userMessage: The resource of type 'REVIEW_JOB' and identifier 'unknownReviewJob' could not be found.
                    additionalInfo:
                      rootExceptionClass: com.nuix.us.exception.i18n.I18nNotFoundException
                      rootExceptionMessage: null
  /cases/{caseId}/reviewJobs:
    get:
      tags:
      - Analysis
      summary: Returns review jobs for a case
      description: Use this operation to see the list of review jobs for a case. All review jobs are returned including fast review jobs. In fast review jobs, reviewers are assigned to a job, enabling a systematic review.
      operationId: getFastReviewJobs
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v1+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewJobResponse'
              example:
              - name: MyFastReviewJob
                guid: 9a6ae288-aa23-44e5-ba6b-f88f588ebbc3
    post:
      tags:
      - Analysis
      summary: Creates a review job for a case
      description: Use this operation to create a review job for a case. Create a review job to enable a systematic review of a case.
      operationId: createReviewJob
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/CreateReviewJobRequest'
            example:
              name: MyReviewJob
              options:
                tags:
                - For Review
                useNearDuplicates: false
                useEmailThreads: false
      responses:
        '201':
          description: default response
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/ReviewJobResponse'
              example:
              - name: MyFastReviewJob
                guid: 9a6ae288-aa23-44e5-ba6b-f88f588ebbc3
        '404':
          description: error response
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/ClusteredRestErrorResponse'
              examples:
                Case Does Not Exist:
                  value:
                    serverId: nuix-restful-server-1
                    errorCode: RESOURCE_NOT_FOUND
                    developerMessage: The resource of type 'CASE' and identifier 'ef61c666296e4fc8a0a79288ab697348' could not be found.
                    userMessage: The resource of type 'CASE' and identifier 'ef61c666296e4fc8a0a79288ab697348' could not be found.
                    additionalInfo:
                      rootExceptionClass: com.nuix.us.exception.i18n.I18nNotFoundException
                      rootExceptionMessage: null
  /cases/{caseId}/reviewJobs/{reviewJobNameOrGuid}/items:
    get:
      tags:
      - Analysis
      summary: Returns the review job items
      description: Use this operation to get the list of items for a review job. The items in a review job are grouped and must be reviewed as an entire family of documents. You can add different tags to each member of the family, but in order to advance to the next batch, the entire family must be tagged.
      operationId: addItemsToReviewJob_1
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      - name: reviewJobNameOrGuid
        in: path
        description: Review job name or guid.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v1+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NuixReviewJobItem'
              example:
              - completionDateTime: null
                item:
                  File Type: text/plain
                  caseName: MyCase
                  date: 1588880372000
                  digests:
                    md5: a9a55486967ac71c24b60fa5c922d716
                  fileType: text/plain
                  guid: 5ce80ae4-5b6f-484f-9563-1fa22c89ae05
                  isBinaryAvailable: true
                  isTopLevel: true
                  text: some text
                  fileSize: 13
        '404':
          description: error response
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/ClusteredRestErrorResponse'
              examples:
                Case Does Not Exist:
                  value:
                    serverId: nuix-restful-server-1
                    errorCode: RESOURCE_NOT_FOUND
                    developerMessage: The resource of type 'CASE' and identifier 'ef61c666296e4fc8a0a79288ab697348' could not be found.
                    userMessage: The resource of type 'CASE' and identifier 'ef61c666296e4fc8a0a79288ab697348' could not be found.
                    additionalInfo:
                      rootExceptionClass: com.nuix.us.exception.i18n.I18nNotFoundException
                      rootExceptionMessage: null
                Invalid Job Review Name:
                  value:
                    serverId: nuix-restful-server-1
                    errorCode: RESOURCE_NOT_FOUND
                    developerMessage: The resource of type 'REVIEW_JOB' and identifier 'unknownReviewJob' could not be found.
                    userMessage: The resource of type 'REVIEW_JOB' and identifier 'unknownReviewJob' could not be found.
                    additionalInfo:
                      rootExceptionClass: com.nuix.us.exception.i18n.I18nNotFoundException
                      rootExceptionMessage: null
    post:
      tags:
      - Analysis
      summary: Adds items to a review job
      description: Use this operation to add items to an existing review job for a case. Items added to a review job are grouped and must be reviewed as an entire family of documents. You can add different tags to each member of the family, but to advance to the next batch, the entire family must be tagged.
      operationId: addItemsToReviewJob
      parameters:
      - name: caseId
        in: path
        description: Case identification token
        required: true
        schema:
          type: string
      - name: reviewJobNameOrGuid
        in: path
        description: Review job name or GUID.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.nuix.v1+json:
            schema:
              $ref: '#/components/schemas/ReviewJobAddItemsRequest'
            example:
              query: guid:9dd7ebaa-0671-4f73-add7-d38d920105eb
              options:
                user: assignedUser1
      responses:
        '200':
          description: default response
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/ReviewJobResponse'
              example:
                name: MyFastReviewJob
                guid: 9a6ae288-aa23-44e5-ba6b-f88f588ebbc3
        '404':
          description: error response
          content:
            application/vnd.nuix.v1+json:
              schema:
                $ref: '#/components/schemas/ClusteredRestErrorResponse'
              examples:
                Case Does Not Exist:
                  value:
                    serverId: nuix-restful-server-1
                    errorCode: RESOURCE_NOT_FOUND
                    developerMessage: The resource of type 'CASE' and identifier 'ef61c666296e4fc8a0a79288ab697348' could not be found.
                    userMessage: The resource of type 'CASE' and identifier 'ef61c666296e4fc8a0a79288ab697348' could not be found.
                    additionalInfo:
                      rootExceptionClass: com.nuix.us.exception.i18n.I18nNotFoundException
                      rootExceptionMessage: null
                Invalid Job Review Name:
                  value:
                    serverId: nuix-restful-server-1
                    errorCode: RESOURCE_NOT_FOUND
                    developerMessage: The resource of type 'REVIEW_JOB' and identifier 'unknownReviewJob' could not be found.
                    userMessage: The resource of type 'REVIEW_JOB' and identifier 'unknownReviewJob' could not be found.
                    additionalInfo:
                      rootExceptionClass: com.nuix.us.exception.i18n.I18nNotFoundException
                      rootExceptionMessage: null
  /cases/{caseId}/batches:
    get:
      tags:
      - Analysis
